name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - name: Test
        run: pytest -q --cov=aerovalid --cov-fail-under=85

  demo-smoke:
    # FR-OPS-003's "demo smoke on Linux": a reduced-scale `fsa run-all` (the full
    # configs/default.yaml scale takes well over 5 min end to end -- see docs/
    # 07_nfr_risks_governance.md's measured NFR-PERF-001 entry -- too slow for a CI
    # gate), run via the installed CLI entrypoint (not pytest) as a genuine black-box
    # check, confirming the report exists and summary.json has no NaN.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Demo smoke
        run: |
          fsa run-all --config configs/default.yaml --run-id ci_demo --profile demo \
            --set generate.n_flights=2 --set "generate.scenarios=[doublet_series]" \
            --set "variants=[V0, V1]"
          test -f runs/ci_demo/reports/report.html
          python -c "
          import json
          summary = json.load(open('runs/ci_demo/reports/summary.json'))
          bad = [k for k, v in summary.items() if isinstance(v, float) and v != v]
          assert not bad, f'NaN in summary.json: {bad}'
          print('summary.json OK:', summary)
          "

  smoke:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Smoke test
        run: pytest -q -m "not slow"
