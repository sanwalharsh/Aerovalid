[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aerovalid"
version = "0.1.0"
description = "AI-assisted flight-simulation validation and predictive analysis for a generic unclassified UAV."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "ruptures>=1.1.9",
  "SALib>=1.5",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "jinja2>=3.1",
  "streamlit>=1.33",
  "pandera>=0.19",
  "joblib>=1.3",
  "scikit-posthocs>=0.9",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "lightgbm>=4.3", "shap>=0.45"]
adapters = ["pymavlink>=2.4", "pyulog>=1.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.9",
  "nbstripout>=0.7",
  "pytest-benchmark>=4.0",
  "pytest-regressions>=0.5",
  "types-PyYAML",
  "pandas-stubs",
]
all = ["aerovalid[ml,adapters,dev]"]

[project.scripts]
fsa = "aerovalid.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aerovalid"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown is out of scope: CLAUDE.md, PROMPT_FOR_CLAUDE_CODE.md, and docs/*.md are the
# frozen spec (several are explicitly "do not edit"), and ruff's formatter reformats
# fenced Python snippets inside them by default -- see docs/DECISIONS.md ADR-007.
# notebooks/ is exploratory only and never imported by src (CLAUDE.md §4); it is not
# held to the same lint/format bar as the package.
extend-exclude = ["*.md", "notebooks/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "SIM", "PIE", "C90"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "ruptures.*", "SALib.*", "pandera.*", "joblib.*", "pyulog.*", "pymavlink.*", "scipy.*",
  "scikit_posthocs.*", "statsmodels.*", "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=aerovalid --cov-fail-under=85"
testpaths = ["tests"]
markers = [
  "slow: long-running tests excluded from test-fast",
  "req(id): links a test to a functional requirement ID",
]

[tool.coverage.run]
source = ["src/aerovalid"]
