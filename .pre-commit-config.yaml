repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        args: [--strict, src]
        pass_filenames: false
        # Runs via the project's own .venv (language: system), not pre-commit's
        # isolated hook env: mypy --strict needs the real numpy/pandas/pydantic/etc.
        # installed, not just the ignore_missing_imports list in pyproject.toml's
        # [[tool.mypy.overrides]] -- replicating that in `additional_dependencies`
        # would mean installing nearly the whole main dependency list twice.

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
